[project]
name = "sugarbeet-weed-segmentation"
version = "0.1.0"
description = "Semantic segmentation for weed detection in sugarbeet fields"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "lightning==2.6.1",
    "numpy>=2.4.2",
    "opencv-python-headless>=4.13.0.92",
    "oyaml>=1.0",
    "scikit-image>=0.26.0",
    "torch==2.6.0",
    "torchmetrics>=1.8.2",
    "torchvision==0.21.0",
    "ultralytics>=8.4.14",
    "wandb>=0.24.2",
    "wget>=3.2",
]
